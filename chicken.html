<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicken Pearly Gates</title>
<style>
body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.container { position: relative; max-width: 100%; }
img { width: 100%; height: auto; display: block; }
.toggle {
  position: absolute;
  top: 21%;
  right: 11%;
  background: white;
  color: black;
  padding: 6px 14px;
  border-radius: 18px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 13px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.25);
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="container">
  <img src="final_chicken.jpg" alt="Chicken at Pearly Gates">
  <div class="toggle">Don't Touch</div>
</div>
</body>
</html>
